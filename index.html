<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b16">
<meta name="description" content="Zuvnelo — One calm space to organize social links, save favourites, and keep recent links close.">
<title>Zuvnelo — One Calm Space</title>

<style>
:root {
  --bg: #090b16;
  --card: rgba(24, 27, 48, .76);
  --card2: rgba(22, 25, 45, .88);
  --text: #f5f5ff;
  --muted: #a4a8c1;
  --border: rgba(191, 194, 255, .15);
  --purple: #8b78ff;
  --cyan: #57dfd0;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 0% 5%, rgba(94, 61, 194, .22), transparent 36%),
    radial-gradient(ellipse at 100% 20%, rgba(30, 160, 163, .12), transparent 35%),
    var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}

button, input {
  font: inherit;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1100px, 92%);
  margin: auto;
  padding-bottom: 50px;
}

.gradient {
  background: linear-gradient(105deg, #9581ff 5%, #8ebdff 48%, #5ce2d0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Glass header */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(9, 11, 22, .73);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-bottom: 1px solid var(--border);
}

.nav {
  height: 72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 23px;
  font-weight: 850;
  letter-spacing: -.8px;
}

.brand-mark {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: #0a0c18;
  background: linear-gradient(135deg, #9581ff, #5ce2d0);
  font-weight: 950;
  font-size: 22px;
  box-shadow: 0 0 28px rgba(139, 120, 255, .18);
}

.nav-actions {
  display: flex;
  gap: 8px;
}

.glass-btn {
  padding: 9px 12px;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(15px);
}

/* Hero */
.hero {
  padding: 64px 0 28px;
}

.hero h1 {
  max-width: 950px;
  font-size: clamp(43px, 9vw, 88px);
  line-height: 1.04;
  letter-spacing: -5px;
  font-weight: 850;
  margin-bottom: 28px;
}

.hero > p {
  max-width: 800px;
  font-size: clamp(19px, 3.4vw, 29px);
  line-height: 1.7;
  color: var(--muted);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--cyan);
  border: 1px solid var(--border);
  background: rgba(23, 26, 47, .58);
  border-radius: 100px;
  padding: 8px 13px;
  font-size: 12px;
  margin-bottom: 24px;
}

.dot {
  width: 7px;
  height: 7px;
  background: var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--cyan);
}

/* Main glass panel */
.panel {
  border: 1px solid var(--border);
  background: linear-gradient(145deg, rgba(27, 30, 54, .86), rgba(16, 18, 34, .79));
  border-radius: 30px;
  padding: 27px;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 24px 80px rgba(0, 0, 0, .17);
}

.panel h2 {
  font-size: 21px;
  margin-bottom: 16px;
}

.input-label {
  display: block;
  font-weight: 700;
  color: #d5d5ea;
  margin-bottom: 12px;
}

.input-row {
  display: flex;
  align-items: center;
  background: rgba(5, 7, 16, .78);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 24px;
  overflow: hidden;
  transition: .2s;
}

.input-row:focus-within {
  border-color: rgba(139,120,255,.7);
  box-shadow: 0 0 0 3px rgba(139,120,255,.1);
}

.input-row input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  padding: 22px 24px;
  font-size: 18px;
}

.input-row input::placeholder {
  color: #777b91;
}

.clear-btn {
  color: var(--muted);
  background: transparent;
  border: 0;
  padding: 12px;
}

.primary-btn {
  display: block;
  width: 100%;
  margin-top: 15px;
  padding: 19px 20px;
  color: #101324;
  font-size: 19px;
  font-weight: 800;
  background: linear-gradient(105deg, #8e79ff, #65bde9, #59dfcf);
  border: 0;
  border-radius: 23px;
  box-shadow: 0 9px 30px rgba(106, 133, 255, .15);
  transition: transform .2s, box-shadow .2s;
}

.primary-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 34px rgba(106, 133, 255, .24);
}

.primary-btn:disabled {
  background: #333644;
  color: #777;
  cursor: not-allowed;
}

.hint {
  margin-top: 17px;
  color: var(--muted);
  font-size: 15px;
}

/* Status messages styling */
#resultArea {
  margin-top: 20px;
  font-size: 16px;
  font-weight: 600;
  text-align: center;
}
.loading { color: var(--cyan); }
.success { color: #5ce2d0; }
.error { color: #ff6b6b; }
</style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">
        <div class="brand-mark">Z</div>
        <span class="gradient">Zuvnelo</span>
      </div>
      <div class="nav-actions">
        <button class="glass-btn">GitHub</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <div class="eyebrow"><div class="dot"></div> Fast & Free Downloader</div>
      <h1>One Calm Space to <span class="gradient">Download Reels</span></h1>
      <p>Instagram, YouTube Shorts, or TikTok links. Paste it, and we will get the video files ready for you instantly.</p>
    </div>

    <div class="panel">
      <h2>Video Downloader</h2>
      <label class="input-label" for="videoUrl">Paste your social media link below</label>
      
      <div class="input-row">
        <!-- यहाँ हमने id="videoUrl" जोड़ दिया है -->
        <input type="text" id="videoUrl" placeholder="https://instagram.com...">
      </div>

      <!-- यहाँ हमने id="downloadBtn" और onclick फंक्शन जोड़ दिया है -->
      <button class="primary-btn" id="downloadBtn" onclick="processDownload()">Download Video</button>
      
      <!-- स्टेटस मैसेज दिखाने की जगह -->
      <div id="resultArea"></div>

      <p class="hint">Note: Video download will start automatically once processed.</p>
    </div>
  </div>

  <!-- 🔥 सबसे ज़रूरी चीज़: जावास्क्रिप्ट फ़ाइल को लिंक करना -->
  <script src="script.js"></script>
</body>
</html>
